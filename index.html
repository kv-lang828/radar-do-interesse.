/* ---------- ARMAZENAMENTO LOCAL ---------- */
const CHAVE = "radar_analise_v1";
let D = { perfil: null, n: {} };
function carregar() {
  try { const x = JSON.parse(localStorage.getItem(CHAVE)); if (x && x.n) D = x; } catch (e) {}
  const url = (new URLSearchParams(location.search).get("perfil") || "").toUpperCase();
  let quiz = null; try { quiz = localStorage.getItem("radar_perfil"); } catch (e) {}
  const p = [url, D.perfil, quiz].find(v => v && NOMES[v]);
  D.perfil = p || null;
}
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(D)); } catch (e) {} }

/* ---------- AJUDAS DE INTERFACE ---------- */
let T = 0;
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const ps = (b, a, c) => a.forEach(x => b.appendChild(h("p", c, x)));
const ul = (b, a) => { const u = h("ul"); a.forEach(x => u.appendChild(h("li", null, x))); b.appendChild(u); };
const bt = (x, f, c) => { const b = h("button", c || "btn", x); b.type = "button"; b.onclick = f; return b; };
const prox = (txt, i) => bt(txt, () => ir(i));
function ir(i) { T = i; mostrar(); }

function escolher(s) {
  const c = h("div", "aviso");
  c.appendChild(h("p", null, "Não identificamos o resultado do seu quiz neste aparelho. Escolha o perfil que você recebeu no quiz gratuito para ver o conteúdo personalizado:"));
  s.appendChild(c);
  Object.keys(NOMES).forEach(k => s.appendChild(bt(NOMES[k], () => { D.perfil = k; salvar(); mostrar(); }, "btn sec")));
}
function campo(box, chave, rot, ph, botao, ao) {
  const l = h("label", "lab", rot), t = h("textarea"), m = h("p", "ok");
  l.htmlFor = t.id = "c_" + chave; t.rows = 4; t.placeholder = ph; t.value = D.n[chave] || ""; m.setAttribute("aria-live", "polite");
  box.append(l, t, bt(botao, () => { D.n[chave] = t.value.trim(); salvar(); m.textContent = "Registro salvo ✓"; if (ao) ao(); }, "btn sec peq"), m);
}

function copiar(texto, aviso) {
  const ok = () => { aviso.textContent = "Mensagem copiada!"; };
  const reserva = () => { const t = h("textarea"); t.value = texto; document.body.appendChild(t); t.select(); try { document.execCommand("copy") ? ok() : (aviso.textContent = "Não foi possível copiar. Selecione o texto e copie manualmente."); } catch (e) { aviso.textContent = "Não foi possível copiar. Selecione o texto e copie manualmente."; } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, reserva); else reserva();
}

  ln.append(h("span", null, "Etapa " + (T + 1) + " de 9"), sel); topo.append(pr, ln);
  app.innerHTML = ""; app.appendChild(topo);
  if (T > 0) s.appendChild(bt("← Voltar", () => ir(T - 1), "link"));

}
